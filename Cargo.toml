[workspace]
resolver = "2"
members = [
    "crates/engine/*",
    "crates/simulation/*",
    "crates/game/*",
    "crates/rendering/*",
    "crates/networking/*",
    "crates/persistence/*",
    "crates/app",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/lithos/lithos"
authors = ["LITHOS Team"]
rust-version = "1.80"

[workspace.dependencies]
# Core
bytemuck = { version = "1.15", features = ["derive"] }
bitvec = { version = "1.0", features = ["alloc"] }
parking_lot = "0.12"
crossbeam = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
once_cell = "1.19"

# Math
nalgebra = "0.32"
# glam = { version = "0.26", features = ["scalar-math", "f32", "f64"] }  # Alternative

# Vulkan
ash = { version = "0.37" }
raw-window-handle = "0.6"
winit = { version = "0.30", features = ["serde"] }

# Profiling
# tracy-client = { version = "0.17" }  # Optional, defined in crates that need it

# Serialization
# Custom - no external deps for hot path

# Testing
proptest = { version = "1.3" }
criterion = { version = "0.5" }

# Config
config = { version = "0.14", features = ["toml"] }

# Profiling/bench
pprof = { version = "0.12" }

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
restriction = "warn"
blanket_clippy_restriction_lints = "allow"
implicit_return = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
wildcard_enum_match_arm = "allow"
missing_docs_in_private_items = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
exhaustive_enums = "allow"
exhaustive_structs = "allow"
pub_use = "allow"
question_mark_used = "allow"
redundant_pub_crate = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release-lto]
inherits = "release"
lto = "thin"

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
lto = false

[profile.test]
inherits = "dev"
opt-level = 2
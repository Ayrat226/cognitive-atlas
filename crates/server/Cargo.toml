[package]
name = "lithos-server"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[[bin]]
name = "lithos-server"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1.38", features = ["full"] }
lithos-engine-memory = { path = "../engine/memory" }
lithos-engine-jobs = { path = "../engine/jobs" }
lithos-engine-math = { path = "../engine/math" }
lithos-engine-logging = { path = "../engine/logging" }
lithos-engine-profiler = { path = "../engine/profiler" }
lithos-engine-config = { path = "../engine/config" }
lithos-engine-serialization = { path = "../engine/serialization" }
lithos-simulation-voxel = { path = "../simulation/voxel" }
lithos-simulation-materials = { path = "../simulation/materials" }
lithos-simulation-processes = { path = "../simulation/processes" }
lithos-simulation-logistics = { path = "../simulation/logistics" }
lithos-simulation-aggregation = { path = "../simulation/aggregation" }
lithos-simulation-worldgen = { path = "../simulation/worldgen" }
lithos-networking-authority = { path = "../networking/authority" }
lithos-networking-replication = { path = "../networking/replication" }
lithos-networking-interest = { path = "../networking/interest" }
lithos-persistence-world-save = { path = "../persistence/world_save" }
lithos-persistence-entity-save = { path = "../persistence/entity_save" }
lithos-persistence-player-save = { path = "../persistence/player_save" }
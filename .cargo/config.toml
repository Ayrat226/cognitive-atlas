[build]
target-dir = "target"
jobs = 8

[target.x86_64-unknown-linux-gnu]
linker = "/home/agent_1cca8499-4f36-455c-984b-e0803e6dac28/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/lib/rustlib/x86_64-unknown-linux-gnu/bin/rust-lld"
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=--library-path=/usr/lib/x86_64-linux-gnu",
]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-lto]
inherits = "release"
lto = "thin"

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true

[profile.test]
opt-level = 2

[alias]
check = "check --workspace --all-targets"
test = "test --workspace --all-targets"
bench = "bench --workspace --all-targets"
fmt = "fmt --all"
clippy = "clippy --workspace --all-targets -- -D warnings"
doc = "doc --workspace --no-deps --document-private-items"

[env]
RUST_BACKTRACE = "1"
CARGO_TERM_COLOR = "always"